[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = False
# Pre-existing typing debt across analysis/; keep CI green while PRs land.
disable_error_code =
    type-var,
    operator,
    assignment,
    var-annotated,
    arg-type,
    return-value,
    attr-defined,
    union-attr,
    misc,
    name-defined,
    call-overload,
    index,
    override,
    valid-type,
    has-type,
    list-item,
    dict-item,
    typeddict-item
