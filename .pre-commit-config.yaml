repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(analysis/|data/)
      - id: trailing-whitespace
        exclude: ^(analysis/|data/)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: ["--line-length=100"]
        exclude: ^(analysis/|data/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: ^(analysis/|data/)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black"]
        exclude: ^(analysis/|data/)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
        files: ^app/
        exclude: ^(analysis/|tests/)
  - repo: local
    hooks:
      - id: forbid-emoji
        name: forbid-emoji
        entry: python3 scripts/check_no_emoji.py
        language: system
        stages: [pre-commit]
        files: "^(app|scripts|tests)/.*\\.py$"
